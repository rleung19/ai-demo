# Backward-compatible compose file (Oracle ADB).
# Prefer: docker compose -f docker-compose.yml -f docker-compose.oracle.yml up -d
# Postgres: docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d

name: ecomm

services:
  app:
    image: ecomm:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_AGENTIC_FLOW_WEBHOOK_URL: ${NEXT_PUBLIC_AGENTIC_FLOW_WEBHOOK_URL}
    container_name: ecomm
    restart: unless-stopped
    ports:
      - "3002:3000"
      - "3003:3001"
    env_file:
      - .env.oci
    volumes:
      - ../wallets/Wallet_HHZJ2H81DDJWN1DM:/opt/oracle/wallet:ro
      - ../.oci:/root/.oci:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
